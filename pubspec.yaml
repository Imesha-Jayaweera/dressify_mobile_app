name: dressify_mobile_app
description: "AI-Powered Virtual Tailoring & Shopping"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1

  # HTTP & Networking
  dio: ^5.4.0
  http: ^1.1.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Image Picker
  image_picker: ^1.1.0

  # Toast Messages
  fluttertoast: ^8.2.1

  #Date Formatting
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_svg: ^2.1.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/